<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>識字挑戰</title>
  <style>
    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body {
      background: linear-gradient(135deg, #e0f7fa 0%, #e1bee7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .card-container {
      background: #ffffff;
      width: 100%;
      max-width: 550px;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      position: relative;
    }
    .progress-bar {
      font-size: 18px;
      color: #666;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .flashcard {
      background: #f7f9fc;
      border: 4px solid #4a90e2;
      border-radius: 20px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0 25px 0;
      transition: all 0.3s ease;
    }
    .flashcard.correct {
      border-color: #2ecc71;
      background: #e8f8f5;
    }
    .flashcard.wrong {
      border-color: #e74c3c;
      background: #fadbd8;
    }
    .word {
      font-size: 64px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 2px;
    }
    .status-text {
      font-size: 18px;
      min-height: 28px;
      color: #7f8c8d;
      margin-bottom: 20px;
    }
    .btn {
      font-size: 22px;
      font-weight: bold;
      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: #4a90e2;
      color: white;
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
      transition: transform 0.1s, background 0.3s;
      width: 100%;
      max-width: 250px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-secondary { background: #95a5a6; box-shadow: none; font-size: 16px; padding: 8px 18px; margin-top: 15px; width: auto;}

    .result-box {
      display: none;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      margin-top: 20px;
      border: 2px solid #e74c3c;
    }
    .result-title { font-size: 26px; color: #c0392b; font-weight: bold; margin-bottom: 10px; }
    .result-info { font-size: 20px; color: #2c3e50; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="card-container">

    // 自動繁簡轉換器：解決普通話 API 常回傳簡體字的問題
    function normalizeText(text) {
      const trad = "陰雲霧濕熱氣車馬魚鳥電龍畫學習運聽話鐘紙筆寫網頭臉腦豬雞鴨龜蟲買賣東後裡乾髒麗難興樹葉陽風門時間長見飛說樂讀飯這過樣覺麼個條隻張塊對雙把部輛萬嗎呢呀啊";
      const simp = "阴云雾湿热气车马鱼鸟电龙画学习运听话钟纸笔写网头脸脑猪鸡鸭龟虫买卖东后里干脏丽难兴树叶阳风门时间长见飞说乐读饭这过样觉么个条只张块对双把部辆万吗呢呀啊";
      let res = "";
      for(let i=0; i<text.length; i++) {
         let char = text[i];
         let idx = trad.indexOf(char);
         if(idx !== -1) {
           res += simp[idx];
         } else {
           res += char;
         }
      }
      return res;
    }

    // 答對時的愉悅音效 (網頁內建合成音，無需下載)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playDingSound() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      oscillator.type = 'sine'; // 圓潤的聲音
      oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // 音高
      oscillator.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
      
      gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); // 漸弱
      
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.3);
    }

    let recognition = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById('status-text').innerHTML = "⚠️ 您的瀏覽器不支援語音識別。<br>請在 <b>Safari</b> 或 <b>Google Chrome</b> 中開啟此網頁。";

    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'zh-CN'; // 強制鎖定為普通話
    }

      }
      document.getElementById('progress').innerText = `進度：第 ${currentIndex + 1} / ${wordList.length} 個詞`;
      document.getElementById('word-display').innerText = wordList[currentIndex];
      
      const flashcard = document.getElementById('flashcard');
      flashcard.className = 'flashcard';
    }

    function toggleChallenge() {
      if (isChallenging) {
        stopChallenge();
      } else {
        startChallenge();
      }
    }

    function startChallenge() {
      if (!recognition) return;

      // 喚醒音頻引擎 (Apple 設備需要用戶點擊時喚醒)
      if (audioCtx.state === 'suspended') audioCtx.resume();

      currentIndex = 0;
      isChallenging = true;
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('start-btn').innerText = '暫停挑戰';
      document.getElementById('start-btn').style.background = '#e74c3c';
      document.getElementById('skip-btn').style.display = 'inline-block';
      document.getElementById('status-text').innerText = '🎤 正在聆聽中，請朗讀卡片上的詞語...';

      updateCard();

      try {
        recognition.start();
      } catch (e) {
        console.log("語音識別已在運行");
      }
    }

    function stopChallenge() {
      isChallenging = false;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      document.getElementById('start-btn').innerText = '重新開始';
      document.getElementById('start-btn').style.background = '#4a90e2';
      document.getElementById('skip-btn').style.display = 'none';
      document.getElementById('status-text').innerText = '挑戰已暫停';
    }

    if (recognition) {
      recognition.onresult = function(event) {
        if (!isChallenging) return;

        const lastIndex = event.results.length - 1;
        const speechResult = event.results[lastIndex][0].transcript.trim();
        const targetWord = wordList[currentIndex].replace(/…/g, ''); 

        console.log("系統聽到:", speechResult, "| 題庫目標:", targetWord);

        // 去除標點符號，並進行【繁簡自動轉換】
        const cleanSpeech = normalizeText(speechResult.replace(/[^\u4e00-\u9fa5]/g, ''));
        const cleanTarget = normalizeText(targetWord.replace(/[^\u4e00-\u9fa5]/g, ''));

        let isCorrect = false;

        // 1. 模糊比對 (互相包含即可，且已經過繁簡轉換)
        if (cleanSpeech.includes(cleanTarget) || cleanTarget.includes(cleanSpeech)) {
          isCorrect = true;
        } else {
          // 2. 容錯比對 (檢查字典裡有沒有這個詞的替代字)
          const aliases = homophoneMap[targetWord];
          if (aliases) {
            for (let i = 0; i < aliases.length; i++) {
              // 把容錯詞也做一次繁簡轉換
              const cleanAlias = normalizeText(aliases[i].replace(/[^\u4e00-\u9fa5]/g, ''));
              if (cleanSpeech.includes(cleanAlias)) {
                isCorrect = true;
                break;
              }
            }
          }
        }

        if (isCorrect) {
          // 讀對了
          playDingSound(); // 播放音效
          
          const flashcard = document.getElementById('flashcard');
          flashcard.className = 'flashcard correct';
          document.getElementById('status-text').innerText = `✅ 讀對了！聽到：「${speechResult}」`;
          
          currentIndex++;
          setTimeout(() => {
            if (isChallenging) updateCard();
          }, 800); // 停留0.8秒讓學生看到綠燈
        } else {
          // 讀錯了
          const flashcard = document.getElementById('flashcard');
          flashcard.className = 'flashcard wrong';
          failChallenge(speechResult);
        }
      };

      recognition.onerror = function(event) {
        if (event.error === 'no-speech') return;
        document.getElementById('status-text').innerText = '⚠️ 發生錯誤: ' + event.error + '，請重試。';
        stopChallenge();
      };

      recognition.onend = function() {
        if (isChallenging) {
          try { recognition.start(); } catch(e){}
        }
      };
    }

    function skipWord() {
      if (!isChallenging) return;
      currentIndex++;
      updateCard();
    }

    function failChallenge(heardText) {
      stopChallenge();
      const failNum = currentIndex + 1;
      const targetWord = wordList[currentIndex];

      const resultBox = document.getElementById('result-box');
      const resultInfo = document.getElementById('result-info');

      resultInfo.innerHTML = `
        你在第 <b>${failNum}</b> 個詞【<span style="color:#2980b9">${targetWord}</span>】失敗了！<br>
        系統聽到的是：「<b>${heardText || "沒有聽清楚"}</b>」<br><br>
        🏆 最終成績：成功連續通過了 <b>${currentIndex}</b> 個詞！
      `;
      resultBox.style.display = 'block';
    }

    function endChallenge(isWin) {
      stopChallenge();
      if (isWin) {
        alert("🎉 太厲害了！你成功挑戰完全部 889 個詞語！");
      }
    }
  </script>
</body>
</html>
