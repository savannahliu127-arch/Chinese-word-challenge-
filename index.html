  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>

    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body {
      background: linear-gradient(135deg, #e0f7fa 0%, #e1bee7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .card-container {
      background: #ffffff;
      width: 90%;
      max-width: 550px;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      position: relative;
    }
    .count-badge {
      background: #2ecc71;
      color: #ffffff;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 8px;
      font-size: 16px;
    }
    .high-score-badge {
      background: #f1c40f;
      color: #7f6000;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 8px;
      font-size: 14px;
      margin-left: 6px;
    }
    .mode-badge {
      background: #e8f4f8;
      color: #2980b9;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 14px;
      margin-bottom: 12px;
      display: inline-block;
      cursor: pointer;
      border: 2px solid #3498db;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(52, 152, 219, 0.2);
    }
    .mode-badge:hover {
      background: #3498db;
      color: #ffffff;
      transform: scale(1.05);
    }
    .progress-bar { font-size: 16px; color: #666; margin-bottom: 15px; }
    .flashcard {
      background: #f7f9fc;
      border: 4px solid #4a90e2;
      border-radius: 20px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 25px 0;
      transition: all 0.15s ease;
    }
    .flashcard.correct { border-color: #2ecc71; background: #e8f8f5; transform: scale(1.03); }
    .flashcard.wrong { border-color: #e74c3c; background: #fadbd8; }
    .word { font-size: 64px; font-weight: bold; color: #2c3e50; letter-spacing: 2px; }
    .status-text { font-size: 18px; min-height: 28px; color: #7f8c8d; margin-bottom: 20px; }
    
    .btn {
      font-size: 18px;
      font-weight: bold;
      padding: 12px 28px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: #4a90e2;
      color: white;
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
      margin: 4px;
      transition: transform 0.1s, background 0.3s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-success { background: #2ecc71; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); }
    .btn-warning { background: #f39c12; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4); }
    .btn-purple { background: #9b59b6; box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4); }
    .btn-danger { background: #e74c3c; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
    .btn-secondary { background: #95a5a6; box-shadow: none; font-size: 16px; padding: 8px 18px; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 25px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .learn-card {
      background: #fef9e7;
      border: 2px dashed #f39c12;
      border-radius: 16px;
      padding: 15px;
      margin: 15px 0;
    }
    .learn-word { font-size: 32px; font-weight: bold; color: #e74c3c; }
    .learn-pinyin { font-size: 24px; font-weight: bold; color: #d35400; margin-top: 4px; }

    .wrong-words-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 10px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 12px;
    }
    .wrong-tag {
      background: #fadbd8;
      border: 1px solid #e74c3c;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 15px;
      color: #c0392b;
    }
  </style>

<body>

  <div class="card-container">
    <div>
      <div class="count-badge" id="count-display">📚 本次認讀：0 個詞</div>
      <div class="high-score-badge" id="high-score-display">🏆 最高紀錄：0</div>
    </div>
    <div>
      <div class="mode-badge" id="mode-display" onclick="promptNewModeSelect()" title="點擊即可切換模式">
        ⚙️ 模式：➡️ 順序認讀 (點擊切換)
      </div>
    </div>
    <div class="progress-bar" id="progress">準備開始認讀大挑戰</div>

    <div class="flashcard" id="flashcard">
      <div class="word" id="word-display">點擊下方開始</div>
    </div>

    <div class="status-text" id="status-text">點擊按鈕開始認讀</div>

    <button class="btn" id="start-btn" onclick="handleClickStart()">開始挑戰</button>
    <br>
    <button class="btn btn-secondary" id="skip-btn" onclick="skipWord()" style="display:none; margin-top:10px;">跳過此詞</button>

    <div class="result-box" id="result-box" style="display:none; margin-top:20px;">
      <div id="result-title" style="font-size:24px; font-weight:bold; color:#2980b9; margin-bottom:10px;">🎯 認讀總結</div>
      <div id="result-info" style="font-size:18px; color:#2c3e50; line-height:1.6;"></div>
    </div>
  </div>

  <!-- 模式選擇對話框 -->
  <div class="modal-overlay" id="mode-select-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #2980b9; margin-bottom: 10px;">🎮 請選擇挑戰模式</div>
      <div style="font-size: 15px; color: #7f8c8d; margin-bottom: 20px;">你想按照固定順序認讀，還是隨機打亂詞語呢？</div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn btn-success" onclick="startNewGame('sequential')">➡️ 順序挑戰 (按 1~889 順序)</button>
        <button class="btn btn-purple" onclick="startNewGame('random')">🔀 隨機大亂鬥 (全詞庫隨機打亂)</button>
      </div>
    </div>
  </div>

  <!-- 讀錯對話框 -->
  <div class="modal-overlay" id="fail-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #e74c3c; margin-bottom: 10px;">💡 認讀小提示</div>
      <div class="learn-card">
        <div style="font-size: 14px; color: #7f8c8d;">這個詞語的標準讀音是：</div>
        <div class="learn-word" id="modal-word">晴朗</div>
        <div class="learn-pinyin" id="modal-pinyin">[ qíng lǎng ]</div>
      </div>
      <div style="font-size: 15px; color: #7f8c8d; margin-bottom: 15px;" id="modal-heard"></div>
      
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-success" onclick="choiceContinue()">💪 繼續挑戰 (重試此詞)</button>
        <button class="btn btn-warning" onclick="choiceRestart()">🔄 重新挑戰 (選擇模式)</button>
        <button class="btn btn-danger" onclick="choiceEnd()">🏁 結束挑戰 (查看結算)</button>
      </div>
    </div>
  </div>

  <!-- 存檔對話框 -->
  <div class="modal-overlay" id="save-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #2980b9; margin-bottom: 15px;">📂 發現歷史存檔</div>
      <div style="font-size: 17px; color: #34495e; margin-bottom: 20px;" id="save-modal-text">上次已挑戰到第 X 個詞，請問要繼續嗎？</div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="btn btn-success" onclick="loadSavedProgress()">繼續上次進度</button>
        <button class="btn btn-warning" onclick="promptNewModeSelect()">全新開始</button>
      </div>
    </div>
  </div>

    let activeWordList = [...rawWordList];
    let currentMode = "sequential";
    let currentIndex = 0;
    let isChallenging = false;
    let recognition = null;
    let audioContext = null;
    let sessionWrongWords = new Set();

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 🎵 升級：歡快遊戲過關 4 音階「水晶八音盒」叮聲
    function playSuccessChime() {
      try {
        const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // Do-Mi-Sol-Do
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.06);
          gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.06);
          osc.stop(ctx.currentTime + i * 0.06 + 0.3);
        });
      } catch(e) {}
    }

    function playFailBuzz() {
      try {
        const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }

    // 🎉 觸發爆發煙花紙屑動畫
    function triggerConfetti() {
      if (window.confetti) {
        confetti({
          particleCount: 40,
          spread: 55,
          origin: { y: 0.65 }

      }

    function loadHighScore() {
      const savedScore = localStorage.getItem('vocab_challenge_max') || 0;
      document.getElementById('high-score-display').innerText = `🏆 最高紀錄：${savedScore}`;
      return parseInt(savedScore);
    }

    function saveProgress() {
      localStorage.setItem('vocab_saved_index', currentIndex);
      localStorage.setItem('vocab_saved_mode', currentMode);
      localStorage.setItem('vocab_saved_list', JSON.stringify(activeWordList));
    }

    function updateCard() {
      if (currentIndex >= activeWordList.length) {
        endChallenge(true);
        return;
      }
      document.getElementById('progress').innerText = `第 ${currentIndex + 1} / ${activeWordList.length} 個詞`;
      document.getElementById('word-display').innerText = activeWordList[currentIndex];
      document.getElementById('count-display').innerText = `📚 本次認讀：${currentIndex} 個詞`;
      document.getElementById('mode-display').innerText = currentMode === 'random' ? "⚙️ 模式：🔀 隨機大亂鬥 (點擊切換)" : "⚙️ 模式：➡️ 順序認讀 (點擊切換)";
      document.getElementById('flashcard').className = 'flashcard';
      saveProgress();
    }

    function handleClickStart() {
      if (isChallenging) {
        stopChallenge();
      } else {
        const savedIdx = parseInt(localStorage.getItem('vocab_saved_index') || '0');
        if (savedIdx > 0 && savedIdx < activeWordList.length) {
          const savedMode = localStorage.getItem('vocab_saved_mode') === 'random' ? '隨機' : '順序';
          document.getElementById('save-modal-text').innerText = `檢測到上次（${savedMode}模式）挑戰到了第 ${savedIdx + 1} 個詞【${activeWordList[savedIdx] || ''}】，請問要繼續嗎？`;
          document.getElementById('save-modal').style.display = 'flex';
        } else {
          promptNewModeSelect();
        }
      }
    }

    function promptNewModeSelect() {
      if (isChallenging) {
        if (!confirm("切換模式將會暫停當前挑戰，確定要切換模式嗎？")) {
          return;
        }
        stopChallenge();
      }
      document.getElementById('save-modal').style.display = 'none';
      document.getElementById('fail-modal').style.display = 'none';
      document.getElementById('mode-select-modal').style.display = 'flex';
    }

    function loadSavedProgress() {
      document.getElementById('save-modal').style.display = 'none';
      currentIndex = parseInt(localStorage.getItem('vocab_saved_index') || '0');
      currentMode = localStorage.getItem('vocab_saved_mode') || 'sequential';
      
      const savedList = localStorage.getItem('vocab_saved_list');
      if (savedList) {
        try { activeWordList = JSON.parse(savedList); } catch(e) { activeWordList = [...rawWordList]; }
      }
      startChallengeProcess();
    }

    function startNewGame(mode) {
      document.getElementById('mode-select-modal').style.display = 'none';
      currentMode = mode;
      if (mode === 'random') {
        activeWordList = shuffleArray(rawWordList);
      } else {
        activeWordList = [...rawWordList];
      }
      currentIndex = 0;
      sessionWrongWords.clear();
      startChallengeProcess();
    }

    function startChallengeProcess() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("您的瀏覽器不支援原生語音辨識，請務必使用 iPad Safari 瀏覽器開啓此網頁！");
        return;
      }

      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();

      isChallenging = true;
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('start-btn').innerText = '結束挑戰';
      document.getElementById('start-btn').style.background = '#e74c3c';
      document.getElementById('skip-btn').style.display = 'inline-block';
      
      updateCard();
      initSpeechRecognition();
    }

    function stopChallenge() {
      isChallenging = false;
      if (recognition) {
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }
      document.getElementById('start-btn').innerText = '重新開始';
      document.getElementById('start-btn').style.background = '#4a90e2';
      document.getElementById('skip-btn').style.display = 'none';
      document.getElementById('status-text').innerText = '挑戰已停止';
    }

    function initSpeechRecognition() {
      if (!isChallenging) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = false;

      const targetWord = activeWordList[currentIndex].replace(/[…\.]/g, '');
      document.getElementById('status-text').innerText = `🎤 請認讀【${targetWord}】...`;

      recognition.onresult = (event) => {
        if (!isChallenging) return;
        const heardText = event.results[0][0].transcript.trim();
        console.log(`聽到的語音：[${heardText}]，目標詞語：[${targetWord}]`);

        if (checkMatch(heardText, targetWord)) {
          handleSuccess();
        } else {
          handleFailPrompt(targetWord, heardText);
        }
      };

      recognition.onerror = (event) => {
        console.warn("語音辨識提示:", event.error);
        if (event.error === 'no-speech' && isChallenging) {
          restartListening();
        }
      };

      recognition.onend = () => {
        if (isChallenging) {
          restartListening();
        }
      };

      try {
        recognition.start();
      } catch(e) {}
    }

    function restartListening() {
      if (!isChallenging) return;
      try {
        recognition.start();
      } catch(e) {}
    }

    function getStandardPinyin(word) {
      if (window.pinyinPro) {
        try {
          return pinyinPro.pinyin(word, { toneType: 'symbol', type: 'string' });
        } catch(e) {}
      }
      return '';
    }

    function getFuzzyPinyin(str) {
      if (!window.pinyinPro || !str) return '';
      try {
        const py = pinyinPro.pinyin(str, { toneType: 'none', type: 'array' }).join('');
        return py.toLowerCase()
          .replace(/ing/g, 'in')
          .replace(/eng/g, 'en')
          .replace(/ang/g, 'an')
          .replace(/ian/g, 'ian')
          .replace(/zh/g, 'z')
          .replace(/ch/g, 'c')
          .replace(/sh/g, 's')
          .replace(/l/g, 'l')
          .replace(/n/g, 'l')
          .replace(/[^a-z]/g, '');
      } catch(e) {
        return '';
      }
    }

    function levenshteinDistance(a, b) {
      if (!a || !b) return (a || b).length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function checkMatch(heard, target) {
      if (!heard || !target) return false;
      
      if (heard.includes(target) || target.includes(heard)) return true;

      const simpHeard = toSimplified(heard);
      const simpTarget = toSimplified(target);
      if (simpHeard.includes(simpTarget) || simpTarget.includes(simpHeard)) return true;

      const cleanHeard = simpHeard.replace(/[^\u4e00-\u9fa5]/g, '');
      const cleanTarget = simpTarget.replace(/[^\u4e00-\u9fa5]/g, '');
      if (cleanHeard.includes(cleanTarget) || cleanTarget.includes(cleanHeard)) return true;

      const pyHeard = getFuzzyPinyin(cleanHeard);
      const pyTarget = getFuzzyPinyin(cleanTarget);

      if (pyHeard && pyTarget) {
        const dist = levenshteinDistance(pyHeard, pyTarget);
        const maxLen = Math.max(pyHeard.length, pyTarget.length);
        const similarity = (maxLen - dist) / maxLen;
        
        console.log(`拼音比對：[${pyHeard}] vs [${pyTarget}]，相似度: ${(similarity * 100).toFixed(1)}%`);

        if (similarity >= 0.60) {
          return true;
        }
      }

      return false;
    }

    // ⚡ 讀對成功處理：引爆煙花 + 播放八音盒 + 150ms 極速轉場
    function handleSuccess() {
      playSuccessChime();
      triggerConfetti();
      document.getElementById('flashcard').className = 'flashcard correct';
      document.getElementById('status-text').innerText = `✨ 認讀正確！`;

      currentIndex++;
      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }

      // ⚡ 轉場時間縮短至 150 毫秒，極速跳至下一詞
      setTimeout(() => {
        if (isChallenging) {
          updateCard();
          initSpeechRecognition();
        }
      }, 150);
    }

    function handleFailPrompt(targetWord, heardText) {
      playFailBuzz();
      document.getElementById('flashcard').className = 'flashcard wrong';
      
      sessionWrongWords.add(targetWord);

      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }

      document.getElementById('modal-word').innerText = targetWord;
      document.getElementById('modal-pinyin').innerText = `[ ${getStandardPinyin(targetWord)} ]`;
      document.getElementById('modal-heard').innerText = heardText ? `(剛才系統聽到的是："${heardText}")` : '(未檢測到清晰語音)';
      document.getElementById('fail-modal').style.display = 'flex';
    }

    function choiceContinue() {
      document.getElementById('fail-modal').style.display = 'none';
      document.getElementById('flashcard').className = 'flashcard';
      initSpeechRecognition();
    }

    function choiceRestart() {
      document.getElementById('fail-modal').style.display = 'none';
      promptNewModeSelect();
    }

    function choiceEnd() {
      document.getElementById('fail-modal').style.display = 'none';
      showFinalSummary();
    }

    function skipWord() {
      if (!isChallenging) return;
      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }
      currentIndex++;
      updateCard();
      initSpeechRecognition();
    }

    function showFinalSummary() {
      stopChallenge();

      const count = currentIndex;
      const currentMax = loadHighScore();
      let isNewRecord = false;

      if (count > currentMax) {
        localStorage.setItem('vocab_challenge_max', count);
        loadHighScore();
        isNewRecord = true;
      }

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = isNewRecord ? "🎉 恭喜刷新最高紀錄！" : "🎯 本次認讀成果總結";
      
      let wrongWordsHTML = "";
      if (sessionWrongWords.size > 0) {
        wrongWordsHTML = `
          <div style="margin-top: 15px; text-align: left;">
            <div style="font-weight: bold; color: #c0392b; font-size: 16px;">❌ 本次遇到的難點詞語（複習錯題集）：</div>
            <div class="wrong-words-grid">
              ${Array.from(sessionWrongWords).map(w => `<div class="wrong-tag"><b>${w}</b> <span style="font-size:13px; color:#7f8c8d;">(${getStandardPinyin(w)})</span></div>`).join('')}
            </div>
          </div>
        `;
      } else {
        wrongWordsHTML = `<div style="margin-top: 10px; color: #27ae60; font-weight: bold;">🌟 太棒了！本次挑戰全程零失誤！</div>`;
      }

      resultInfo.innerHTML = `
        📚 本次共成功認讀了 <b>${count}</b> 個詞語！<br>
        ${isNewRecord ? "🌟 成功創下新的個人最高紀錄！" : "繼續加油，超越最高紀錄！"}
        ${wrongWordsHTML}
      `;
      resultBox.style.display = 'block';
    }

    function endChallenge(isWin) {
      stopChallenge();
      const count = currentIndex;
      localStorage.setItem('vocab_challenge_max', activeWordList.length);
      loadHighScore();

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = "🎉 認讀大挑戰全滿貫！";
      resultInfo.innerHTML = `📚 太棒了！你成功認讀完全部 <b>${count}</b> 個詞語！`;
      resultBox.style.display = 'block';
    }

    loadHighScore();
    const savedListStr = localStorage.getItem('vocab_saved_list');
    if (savedListStr) {
      try { activeWordList = JSON.parse(savedListStr); } catch(e) {}
    }
    currentMode = localStorage.getItem('vocab_saved_mode') || 'sequential';
    document.getElementById('mode-display').innerText = currentMode === 'random' ? "⚙️ 模式：🔀 隨機大亂鬥 (點擊切換)" : "⚙️ 模式：➡️ 順序認讀 (點擊切換)";
