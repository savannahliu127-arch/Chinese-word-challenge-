      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0 25px 0;

    .status-text { font-size: 18px; min-height: 28px; color: #7f8c8d; margin-bottom: 20px; }
    .btn {

      cursor: pointer;
      background: #4a90e2;
      color: white;

    .btn-secondary { background: #95a5a6; box-shadow: none; font-size: 16px; padding: 8px 18px; margin-top: 15px; }

    .result-box {
      display: none;
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      margin-top: 20px;
      border: 2px solid #3498db;

      const date = new Date().toUTCString();
      const requestLine = "GET /v2/open-ise HTTP/1.1";
      const signatureOrigin = `host: ${host}\ndate: ${date}\n${requestLine}`;
      const signatureSha = CryptoJS.HmacSHA256(signatureOrigin, API_SECRET);
      const signature = CryptoJS.enc.Base64.stringify(signatureSha);
      const authorizationOrigin = `api_key="${API_KEY}", algorithm="hmac-sha256", headers="host date request-line", signature="${signature}"`;
      const authorization = btoa(authorizationOrigin);
      return `wss://${host}/v2/open-ise?authorization=${authorization}&date=${encodeURIComponent(date)}&host=${host}`;
    }

    function startEvaluateCurrentWord() {
      if (!isChallenging) return;

      const currentWord = wordList[currentIndex].replace(/[…\.]/g, '');
      document.getElementById('status-text').innerText = `🎤 請認讀【${currentWord}】...`;

      const url = getWebSocketUrl();
      ws = new WebSocket(url);

      ws.onopen = () => {
        const params = {
          common: { app_id: APPID },
          business: {
            category: "read_word",
            sub: "ise",
            ent: "cn_vip",
            cmd: "ssb",
            text: `\uFEFF[ise]\nlanguage=zh_cn\ncategory=read_word\n${currentWord}`,
            tte: "utf8",
            auf: "audio/L16;rate=16000",
            aus: 1,
            awa: "number"
          },
          data: { status: 0 }
        };
        ws.send(JSON.stringify(params));
        startAudioRecording();
      };

      ws.onmessage = (event) => {
        const res = JSON.parse(event.data);
        if (res.code === 0 && res.data && res.data.data) {
          const xmlStr = atob(res.data.data);
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlStr, "text/xml");
          const totalScoreElem = xmlDoc.querySelector("read_word") || xmlDoc.querySelector("rec_paper");
          
          let score = 0;
          if (totalScoreElem && totalScoreElem.getAttribute("total_score")) {
            score = parseFloat(totalScoreElem.getAttribute("total_score"));
          } else {
            const scoreAttr = xmlDoc.documentElement.getAttribute("total_score");
            if (scoreAttr) score = parseFloat(scoreAttr);
          }

          handleResult(score, currentWord);
        }
      };

      ws.onerror = (err) => {
        console.error("訊飛連接錯誤:", err);
        document.getElementById('status-text').innerText = "⚠️ 連接訊飛服務失敗，請檢查 API Key 設置";
      };
    }

    function startAudioRecording() {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaStream = stream;
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = audioContext.createMediaStreamSource(stream);
        scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

        scriptProcessor.onaudioprocess = (e) => {
          if (!isChallenging || !ws || ws.readyState !== WebSocket.OPEN) return;
          const inputData = e.inputBuffer.getChannelData(0);
          const pcmData = convertTo16BitPCM(inputData);
          const base64Data = arrayBufferToBase64(pcmData);

          ws.send(JSON.stringify({
            business: { cmd: "auw", aus: 2 },
            data: { status: 1, format: "audio/L16;rate=16000", encoding: "raw", audio: base64Data }
          }));
        };

        source.connect(scriptProcessor);
        scriptProcessor.connect(audioContext.destination);
      }).catch(err => {
        alert("無法獲取麥克風權限: " + err);
      });
    }

    function stopAudioRecording() {
      if (scriptProcessor) scriptProcessor.disconnect();
      if (audioContext) audioContext.close();
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
    }

    function convertTo16BitPCM(input) {
      const output = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return output.buffer;
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function handleResult(score, word) {
      stopAudioRecording();
      if (ws) ws.close();

      // 判定條件：只要開口且被評測捕捉到（> 25 分），直接通過
      if (score >= MIN_ACCEPT_SCORE) {
        successAudio.currentTime = 0;
        successAudio.play();
        document.getElementById('flashcard').className = 'flashcard correct';
        document.getElementById('status-text').innerText = `✅ 認讀成功！下一個...`;

        currentIndex++;
        setTimeout(() => {
          if (isChallenging) {
            updateCard();
            startEvaluateCurrentWord();
          }
        }, 800);
      } else {
        failAudio.currentTime = 0;
        failAudio.play();
        document.getElementById('flashcard').className = 'flashcard wrong';
        failChallenge(word);
      }
    }

    function skipWord() {
      if (!isChallenging) return;
      stopAudioRecording();
      if (ws) ws.close();
      currentIndex++;
      updateCard();
      startEvaluateCurrentWord();
    }

    function failChallenge(targetWord) {
      stopChallenge();
      const count = currentIndex;
      const currentMax = loadHighScore();
      let isNewRecord = false;

      // 保存並更新最高紀錄
      if (count > currentMax) {
        localStorage.setItem('vocab_challenge_max', count);
        loadHighScore();
        isNewRecord = true;
      }

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      if (isNewRecord) {
        resultTitle.innerText = "🎉 恭喜刷新最高紀錄！";
        resultTitle.style.color = "#27ae60";
      } else {
        resultTitle.innerText = "🎯 本次挑戰結束";
        resultTitle.style.color = "#2980b9";
      }

      resultInfo.innerHTML = `
        挑戰到第 <b>${count + 1}</b> 個詞【<span style="color:#e74c3c">${targetWord}</span>】停止了。<br><br>
        📚 本次共成功認讀了 <b>${count}</b> 個詞語！<br>
        ${isNewRecord ? "🌟 成功創下新的個人最高紀錄！" : "繼續加油，爭取超越最高紀錄！"}
      `;
      resultBox.style.display = 'block';
    }

    function endChallenge(isWin) {
      stopChallenge();
      if (isWin) {
        localStorage.setItem('vocab_challenge_max', wordList.length);
        loadHighScore();
        alert(`🎉 太厲害了！你成功認讀完全部 ${wordList.length} 個詞語！`);
      }
    }

    // 初始化載入歷史最高紀錄
    loadHighScore();
  </script>
</body>
</html>
