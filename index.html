      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 🚀 玻璃霓虹面板 */
    .card-container {
      background: rgba(20, 26, 48, 0.85);
      border: 2px solid #00f2fe;
      backdrop-filter: blur(16px);
      width: 95%;
      max-width: 580px;
      padding: 28px 24px;
      border-radius: 28px;
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.25), inset 0 0 15px rgba(0, 242, 254, 0.1);
      text-align: center;
      position: relative;
    }

    /* 頂部數據標籤 */
    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
    }
    .count-badge {
      background: linear-gradient(135deg, #00b09b, #96c93d);
      color: #ffffff;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 0 10px rgba(0, 176, 155, 0.4);
    }
    .planet-badge {
      background: linear-gradient(135deg, #8e2de2, #4a00e0);
      color: #ffffff;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 0 12px rgba(142, 45, 226, 0.5);
    }
    .high-score-badge {
      background: #f1c40f;
      color: #4a3b00;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
    }
    .mode-badge {
      background: rgba(0, 242, 254, 0.15);
      color: #00f2fe;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 13px;
      margin-bottom: 15px;
      display: inline-block;
      cursor: pointer;
      border: 1px solid #00f2fe;
      transition: all 0.2s ease;
    }
    .mode-badge:hover {
      background: #00f2fe;
      color: #090a0f;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
    }

    /* 🚀 動態火箭軌道 */
    .rocket-track-container {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      height: 28px;
      margin: 10px 0 18px 0;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 242, 254, 0.3);
    }
    .rocket-progress-fill {
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 12px #00f2fe;
    }
    .rocket-icon {
      position: absolute;
      top: -2px;
      font-size: 20px;
      transition: left 0.3s ease;
      transform: translateX(-50%);
    }

    /* 🪐 發音卡片 */
    .flashcard {
      background: rgba(15, 20, 38, 0.7);
      border: 3px solid #4facfe;
      border-radius: 22px;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 20px 0;
      transition: all 0.15s ease;
      box-shadow: 0 0 20px rgba(79, 172, 254, 0.2);
    }
    .flashcard.correct {
      border-color: #00ff88;
      background: rgba(0, 255, 136, 0.15);
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
    }
    .flashcard.wrong {
      border-color: #ff4757;
      background: rgba(255, 71, 87, 0.15);
      box-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
    }
    .word {
      font-size: 68px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    .status-text {
      font-size: 18px;
      min-height: 28px;
      color: #a0aec0;
      margin-bottom: 20px;
    }
    
    /* 霓虹按鈕 */
    .btn {
      font-size: 18px;
      font-weight: bold;
      padding: 12px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #090a0f;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
      margin: 4px;
      transition: transform 0.1s, box-shadow 0.3s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; box-shadow: 0 0 20px rgba(56, 239, 125, 0.4); }

    .btn-purple { background: linear-gradient(135deg, #8e2de2, #4a00e0); color: #fff; box-shadow: 0 0 20px rgba(142, 45, 226, 0.4); }
    .btn-danger { background: linear-gradient(135deg, #f857a6, #ff5858); color: #fff; box-shadow: 0 0 20px rgba(248, 87, 166, 0.4); }
    .btn-secondary { background: rgba(255, 255, 255, 0.2); color: #fff; box-shadow: none; font-size: 15px; padding: 8px 18px; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 7, 15, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #141a30;
      border: 2px solid #00f2fe;
      border-radius: 28px;
      padding: 26px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.3);
      color: #fff;
    }

    .learn-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed #f1c40f;
      border-radius: 18px;
      padding: 16px;
      margin: 16px 0;

      <div class="count-badge" id="dist-display">🚀 航行里程：0 萬 km</div>

      </div>
    </div>

    <div class="status-text" id="progress">準備出發！探索星際宇宙</div>

    <div class="flashcard" id="flashcard">

    </div>

    <div class="status-text" id="status-text">點擊按鈕點燃發射火箭</div>

    <br>
    <button class="btn btn-secondary" id="skip-btn" onclick="skipWord()" style="display:none; margin-top:10px;">跳過此星區</button>

    <!-- 結算報告 -->
    <div class="result-box" id="result-box" style="display:none; margin-top:20px;">
      <div id="result-title" style="font-size:24px; font-weight:bold; color:#00f2fe; margin-bottom:10px;">🎯 星際航行日誌</div>
      <div id="result-info" style="font-size:17px; color:#cbd5e0; line-height:1.6;"></div>
    </div>
  </div>

  <!-- 模式選擇 Modal -->
  <div class="modal-overlay" id="mode-select-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #00f2fe; margin-bottom: 10px;">🎮 請選擇航行模式</div>
      <div style="font-size: 15px; color: #a0aec0; margin-bottom: 20px;">你想按照固定航線認讀，還是探索隨機星域呢？</div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn btn-success" onclick="startNewGame('sequential')">➡️ 順序航程 (按 1~889 順序)</button>
        <button class="btn btn-purple" onclick="startNewGame('random')">🔀 隨機大亂鬥 (全宇宙隨機打亂)</button>
      </div>
    </div>
  </div>

  <!-- 讀錯提示 Modal -->
  <div class="modal-overlay" id="fail-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #ff4757; margin-bottom: 10px;">⚡ 語音能量對頻中</div>
      <div class="learn-card">
        <div style="font-size: 14px; color: #a0aec0;">這個詞語的星際標準發音是：</div>
        <div class="learn-word" id="modal-word">晴朗</div>
        <div class="learn-pinyin" id="modal-pinyin">[ qíng lǎng ]</div>
      </div>
      <div style="font-size: 15px; color: #a0aec0; margin-bottom: 15px;" id="modal-heard"></div>
      
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-success" onclick="choiceContinue()">⚡ 再次對頻 (重試此詞)</button>
        <button class="btn btn-warning" onclick="choiceRestart()">🔄 重置航程 (選擇模式)</button>
        <button class="btn btn-danger" onclick="choiceEnd()">🏁 降落基地 (查看總結)</button>
      </div>
    </div>
  </div>

    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #00f2fe; margin-bottom: 15px;">📂 發現歷史航行日誌</div>

      </div>

      }

    function playSuccessChime() {
      try {
        const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.05);
          gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.05);
          osc.stop(ctx.currentTime + i * 0.05 + 0.25);
        });
      } catch(e) {}
    }

    function playFailBuzz() {
      try {
        const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }

        console.log(`聽到的語音：[${heardText}]，目標詞語：[${targetWord}]`);

        if (checkMatch(heardText, targetWord)) {
          handleSuccess();

        }
      };

        console.warn("語音辨識提示:", event.error);
        if (event.error === 'no-speech' && isChallenging) {
          restartListening();
        }
      };

      recognition.onend = () => {
        if (isChallenging) {

        }

    function getStandardPinyin(word) {
      if (window.pinyinPro) {
        try {
          return pinyinPro.pinyin(word, { toneType: 'symbol', type: 'string' });
        } catch(e) {}
      }
      return '';
    }

    function getFuzzyPinyin(str) {
      if (!window.pinyinPro || !str) return '';
      try {
        const py = pinyinPro.pinyin(str, { toneType: 'none', type: 'array' }).join('');
        return py.toLowerCase()
          .replace(/ing/g, 'in')
          .replace(/eng/g, 'en')
          .replace(/ang/g, 'an')
          .replace(/ian/g, 'ian')
          .replace(/zh/g, 'z')
          .replace(/ch/g, 'c')
          .replace(/sh/g, 's')
          .replace(/l/g, 'l')
          .replace(/n/g, 'l')
          .replace(/[^a-z]/g, '');
      } catch(e) {
        return '';
      }
    }

    function levenshteinDistance(a, b) {
      if (!a || !b) return (a || b).length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function checkMatch(heard, target) {
      if (!heard || !target) return false;
      
      if (heard.includes(target) || target.includes(heard)) return true;

      const simpHeard = toSimplified(heard);
      const simpTarget = toSimplified(target);
      if (simpHeard.includes(simpTarget) || simpTarget.includes(simpHeard)) return true;

      const cleanHeard = simpHeard.replace(/[^\u4e00-\u9fa5]/g, '');
      const cleanTarget = simpTarget.replace(/[^\u4e00-\u9fa5]/g, '');
      if (cleanHeard.includes(cleanTarget) || cleanTarget.includes(cleanHeard)) return true;

      const pyHeard = getFuzzyPinyin(cleanHeard);
      const pyTarget = getFuzzyPinyin(cleanTarget);

      if (pyHeard && pyTarget) {
        const dist = levenshteinDistance(pyHeard, pyTarget);
        const maxLen = Math.max(pyHeard.length, pyTarget.length);
        const similarity = (maxLen - dist) / maxLen;
        
        console.log(`拼音比對：[${pyHeard}] vs [${pyTarget}]，相似度: ${(similarity * 100).toFixed(1)}%`);

        if (similarity >= 0.60) {
          return true;
        }
      }

      return false;
    }

      }

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = isNewRecord ? "🎉 恭喜創下最遠航行紀錄！" : "🎯 星際航行成果報告";
      
      let wrongWordsHTML = "";
      if (sessionWrongWords.size > 0) {
        wrongWordsHTML = `
          <div style="margin-top: 15px; text-align: left;">
            <div style="font-weight: bold; color: #ff4757; font-size: 16px;">❌ 本次待強化對頻的星際詞語：</div>
            <div class="wrong-words-grid">
              ${Array.from(sessionWrongWords).map(w => `<div class="wrong-tag"><b>${w}</b> <span style="font-size:13px; color:#a0aec0;">(${getStandardPinyin(w)})</span></div>`).join('')}
            </div>
          </div>
        `;
      } else {
        wrongWordsHTML = `<div style="margin-top: 10px; color: #38ef7d; font-weight: bold;">🌟 太完美了！火箭全程零失誤推進！</div>`;
      }

      resultInfo.innerHTML = `
        🚀 本次航行里程：<b>${count * 10} 萬公里</b>（成功認讀 <b>${count}</b> 個詞語）！<br>
        🪐 目前抵達星區：<b>${getCurrentPlanet(count)}</b><br>
        ${isNewRecord ? "🌟 成功創下新的個人最高航行里程紀錄！" : "繼續加油，解鎖更遠的宇宙星系！"}
        ${wrongWordsHTML}
      `;
      resultBox.style.display = 'block';
    }

    function endChallenge(isWin) {
      stopChallenge();
      const count = currentIndex;
      localStorage.setItem('vocab_challenge_max', activeWordList.length);
      loadHighScore();

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = "🎉 恭喜通關整片宇宙！";
      resultInfo.innerHTML = `📚 太震撼了！你成功駕駛火箭橫跨了整片宇宙，認讀完全部 <b>${count}</b> 個詞語！`;
      resultBox.style.display = 'block';
    }

    loadHighScore();
    const savedListStr = localStorage.getItem('vocab_saved_list');
    if (savedListStr) {
      try { activeWordList = JSON.parse(savedListStr); } catch(e) {}
    }
    currentMode = localStorage.getItem('vocab_saved_mode') || 'sequential';
    document.getElementById('mode-display').innerText = currentMode === 'random' ? "⚙️ 模式：🔀 隨機大亂鬥 (點擊切換)" : "⚙️ 模式：➡️ 順序認讀 (點擊切換)";
  </script>
</body>
</html>
