  <style>
    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body {
      background: linear-gradient(135deg, #e0f7fa 0%, #e1bee7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .card-container {
      background: #ffffff;
      width: 90%;
      max-width: 550px;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      position: relative;
    }
    .progress-bar {
      font-size: 18px;
      color: #666;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .flashcard {
      background: #f7f9fc;
      border: 4px solid #4a90e2;
      border-radius: 20px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0 25px 0;
      transition: all 0.3s ease;
    }
    .flashcard.correct {
      border-color: #2ecc71;
      background: #e8f8f5;
    }
    .flashcard.wrong {
      border-color: #e74c3c;
      background: #fadbd8;
    }
    .word {
      font-size: 64px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 2px;
    }
    .status-text {
      font-size: 18px;
      min-height: 28px;
      color: #7f8c8d;
      margin-bottom: 20px;
    }
    .btn {
      font-size: 22px;
      font-weight: bold;
      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: #4a90e2;
      color: white;
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
      transition: transform 0.1s, background 0.3s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-secondary { background: #95a5a6; box-shadow: none; font-size: 16px; padding: 8px 18px; margin-top: 15px; }

    .result-box {
      display: none;
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      margin-top: 20px;
      border: 2px solid #e74c3c;
    }
    .result-title { font-size: 26px; color: #c0392b; font-weight: bold; margin-bottom: 10px; }
    .result-info { font-size: 20px; color: #2c3e50; line-height: 1.6; }
  </style>
</head>

    function simpToTrad(str) {
      return str.split('').map(char => simpToTradMap[char] || char).join('');
    }

    // 💡 同音字 / 易錯字 高度容錯字典
    const toleranceDict = {
      "陰天": ["阴天", "一天", "英天"],

      "輕飄飄": ["青飄飄"],
      "冷冰冰": ["冷兵兵"],
      "熱騰騰": ["熱疼疼"],
      "圓呼呼": ["圓乎乎"],
      "毛茸茸": ["毛絨絨", "毛容容"],
      "胖墩墩": ["胖蹲蹲"],
      "髒兮兮": ["髒西西"],
      "羨慕": ["線幕", "羡慕"],
      "妒忌": ["肚忌", "度忌", "毒氣"],
      "吱吱喳喳": ["知知喳喳"],
      "乒乒乓乓": ["冰冰邦邦", "兵兵乓乓"],
      "嘰哩呱啦": ["機里呱啦", "基里呱啦"],
      "嘰哩咕嚕": ["機里咕嚕", "基里咕嚕"]

    let currentIndex = 0;
    let isChallenging = false;
    let recognition = null;
    
    const successAudio = document.getElementById('success-sound');
    const failAudio = document.getElementById('fail-sound');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("⚠️ 您的瀏覽器不支援實時語音識別，請使用 Google Chrome 或 iPad Safari 瀏覽器。");
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'zh-CN'; // 普通話模式
    }

    function updateCard() {
      if (currentIndex >= wordList.length) {
        endChallenge(true);
        return;
      }
      document.getElementById('progress').innerText = `進度：第 ${currentIndex + 1} / ${wordList.length} 個詞`;
      document.getElementById('word-display').innerText = wordList[currentIndex];
      
      const flashcard = document.getElementById('flashcard');
      flashcard.className = 'flashcard';
    }

    function toggleChallenge() {
      if (isChallenging) {
        stopChallenge();
      } else {
        startChallenge();
      }
    }

    function startChallenge() {
      if (!recognition) return;

      successAudio.volume = 0.5;
      failAudio.volume = 0.5;
      successAudio.play().then(() => { successAudio.pause(); successAudio.currentTime = 0; }).catch(() => {});
      failAudio.play().then(() => { failAudio.pause(); failAudio.currentTime = 0; }).catch(() => {});

      currentIndex = 0;
      isChallenging = true;
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('start-btn').innerText = '停止挑戰';
      document.getElementById('start-btn').style.background = '#e74c3c';
      document.getElementById('skip-btn').style.display = 'inline-block';
      document.getElementById('status-text').innerText = '🎤 正在聆聽中，請朗讀卡片上的詞語...';

      updateCard();

      try {
        recognition.start();
      } catch (e) {
        console.log("語音已開啟");
      }
    }

    function stopChallenge() {
      isChallenging = false;
      if (recognition) recognition.stop();
      document.getElementById('start-btn').innerText = '開始闖關';
      document.getElementById('start-btn').style.background = '#4a90e2';
      document.getElementById('skip-btn').style.display = 'none';
      document.getElementById('status-text').innerText = '挑戰已暫停';
    }

    if (recognition) {
      recognition.onresult = function(event) {
        if (!isChallenging) return;

        const lastIndex = event.results.length - 1;
        const speechResult = event.results[lastIndex][0].transcript.trim();
        const rawTargetWord = wordList[currentIndex];
        
        const targetWord = rawTargetWord.replace(/[…\.]/g, ''); 

        console.log("聽到的音:", speechResult, "| 目標詞:", targetWord);

        const cleanSpeech = speechResult.replace(/[^一-龥]/g, '');
        const cleanTarget = targetWord.replace(/[^一-龥]/g, '');

        // 將識別到的文字自動轉換成繁體再比對
        const tradSpeech = simpToTrad(cleanSpeech);

        let isCorrect = false;

        // 1. 精確比對 (繁體/簡體均可匹配)
        if (cleanSpeech.includes(cleanTarget) || tradSpeech.includes(cleanTarget)) {
          isCorrect = true;
        } 
        // 2. 容錯字典比對
        else if (toleranceDict[rawTargetWord]) {
          const alts = toleranceDict[rawTargetWord];
          for (let i = 0; i < alts.length; i++) {
            if (cleanSpeech.includes(alts[i]) || tradSpeech.includes(alts[i])) {
              isCorrect = true;
              console.log(`觸發容錯機制：目標【${rawTargetWord}】，聽到「${alts[i]}」視為正確。`);
              break;
            }
          }
        }

        if (isCorrect) {
          successAudio.currentTime = 0;
          successAudio.play();
          
          const flashcard = document.getElementById('flashcard');
          flashcard.className = 'flashcard correct';
          document.getElementById('status-text').innerText = `✅ 讀對了！聽到：「${speechResult}」`;
          
          currentIndex++;
          setTimeout(() => {
            if (isChallenging) updateCard();
          }, 800);
        } else {
          failAudio.currentTime = 0;
          failAudio.play();
          
          const flashcard = document.getElementById('flashcard');
          flashcard.className = 'flashcard wrong';
          failChallenge(speechResult);
        }
      };

      recognition.onerror = function(event) {
        if (event.error === 'no-speech') return;
        document.getElementById('status-text').innerText = '⚠️ 語音識別發生錯誤: ' + event.error;
      };

      recognition.onend = function() {
        if (isChallenging) {
          try { recognition.start(); } catch(e){}
        }
      };
    }

    function skipWord() {
      if (!isChallenging) return;
      currentIndex++;
      updateCard();
    }

    function failChallenge(heardText) {
      stopChallenge();
      const failNum = currentIndex + 1;
      const targetWord = wordList[currentIndex];

      const resultBox = document.getElementById('result-box');
      const resultInfo = document.getElementById('result-info');

      let tipHtml = "";
      if (toleranceDict[targetWord]) {
        tipHtml = `<br><span style="font-size:16px; color:#7f8c8d;">💡 提示：此詞允許的近音字包括 (${toleranceDict[targetWord].join(', ')})</span>`;
      }

      resultInfo.innerHTML = `
        你在第 <b>${failNum}</b> 個詞【<span style="color:#2980b9">${targetWord}</span>】失敗了！<br>
        系統聽到的是：「<b>${heardText || "未聽到聲音"}</b>」<br>
        ${tipHtml}<br><br>
        🏆 最終成績：成功連續通過了 <b>${currentIndex}</b> 個詞！
      `;
      resultBox.style.display = 'block';
    }

    function endChallenge(isWin) {
      stopChallenge();
      if (isWin) {
        alert("🎉 太厲害了！你成功挑戰完全部 889 個詞語！");
      }
    }
